name: Quality checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install editable package and development tools
        run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run tests
        run: python -m pytest

  container:
    name: Docker API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install smoke test dependencies
        run: python -m pip install -c constraints-dev.txt -e .
      - name: Build the inference image
        run: docker build --tag elliptic-fraud:ci .
      - name: Score a synthetic graph in the running container
        run: python scripts/smoke_container.py elliptic-fraud:ci
