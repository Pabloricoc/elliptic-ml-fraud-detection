[build-system]
requires = ["flit_core==4.2.0"]
build-backend = "flit_core.buildapi"

[project]
name = "elliptic-fraud"
version = "0.1.0"
description = "Tools for working with the Elliptic Bitcoin transaction dataset"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.7,<1.8",
    "xgboost-cpu>=3.1,<3.2; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "xgboost>=3.1,<3.2; (sys_platform != 'win32' and sys_platform != 'linux') or (platform_machine != 'AMD64' and platform_machine != 'x86_64')",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
]

[project.scripts]
elliptic-check-data = "elliptic_fraud.check_data:main"
elliptic-data = "elliptic_fraud.data_cli:main"
elliptic-train = "elliptic_fraud.train:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
